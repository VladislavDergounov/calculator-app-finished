name: Checkout Example

on:
  push:
  workflow_dispatch:

jobs:
  checkout-example:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
    
      - name: Verify checkout - list directories and contents
        run: ls -alhR
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
