name: Dependencies Example

on:
  push:
  workflow_dispatch:

jobs: 
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify - list directories and contents
        run: ls -alhR
